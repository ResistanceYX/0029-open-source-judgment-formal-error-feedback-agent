name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests -q
      - name: Example smoke (anomalies sample)
        run: python -m judgment_formal_lint.cli lint examples/synthetic/sample_anomalies.txt -o /tmp/smoke
      - name: Example smoke (clean sample)
        run: python -m judgment_formal_lint.cli lint examples/synthetic/sample_clean.txt -o /tmp/smoke2
